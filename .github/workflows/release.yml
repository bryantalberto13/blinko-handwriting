name: Release plugin

# On every push to main, publish release v<plugin.json version> with release.zip if that
# release doesn't exist yet. Blinko's "Install from GitHub" downloads the latest release.zip.
# To ship a new version, bump "version" in plugin.json and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run build
      - name: Publish release if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(jq -r .version plugin.json)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released; bump plugin.json version to publish."
            exit 0
          fi
          (cd release && zip -r ../release.zip .)
          gh release create "$TAG" release.zip --target "$GITHUB_SHA" --title "$TAG" --notes "Handwritten Notes $TAG"
